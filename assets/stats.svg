<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="140" viewBox="0 0 1000 140" role="img" aria-labelledby="stats-t">
  <title id="stats-t">3 hackathon podiums in 2026; 1,000+ students reached as PISA president; 40% faster reporting at Fibzio; ~30% faster property demos at OpenSky VR</title>
  <defs>
