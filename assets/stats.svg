      <stop offset="0" stop-color="#190B12"/><stop offset="1" stop-color="#23091A"/>
    </linearGradient>
    <linearGradient id="stats-rule" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#C77B9B"/><stop offset="1" stop-color="#C77B9B" stop-opacity="0"/>
    </linearGradient>
    <pattern id="stats-dots" width="8" height="8" patternUnits="userSpaceOnUse">
      <circle cx="4" cy="4" r="0.6" fill="#C77B9B" fill-opacity="0.12"/>
    </pattern>
    <clipPath id="stats-clip"><rect width="1000" height="140" rx="0"/></clipPath>
    
  </defs>
  <g clip-path="url(#stats-clip)">
