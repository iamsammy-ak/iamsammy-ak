      <stop offset="0" stop-color="#C77B9B"/><stop offset="1" stop-color="#C77B9B" stop-opacity="0"/>
    </linearGradient>
    <pattern id="podium-dots" width="8" height="8" patternUnits="userSpaceOnUse">
      <circle cx="4" cy="4" r="0.6" fill="#C77B9B" fill-opacity="0.12"/>
    </pattern>
    <clipPath id="podium-clip"><rect width="1000" height="262" rx="0"/></clipPath>
    <radialGradient id="podium-medal" cx="0.35" cy="0.3" r="0.8"><stop offset="0" stop-color="#E5B5C7"/><stop offset="1" stop-color="#701A3D"/></radialGradient><filter id="podium-glow" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="6"/></filter>
  </defs>
