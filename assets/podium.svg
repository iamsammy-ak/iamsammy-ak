<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="262" viewBox="0 0 1000 262" role="img" aria-labelledby="podium-t">
  <title id="podium-t">1st LOKI Urban Monitoring Hackathon 404: Pothole Not Found · Oct 2026; 2nd Automation Hackathon Mar 2026; 1st Therness Hackathon Feb 2026</title>
  <defs>
    <linearGradient id="podium-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#190B12"/><stop offset="1" stop-color="#23091A"/>
    </linearGradient>
