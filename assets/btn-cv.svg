<text x="18" y="26" font-family="Georgia, 'Iowan Old Style', 'Palatino Linotype', 'Times New Roman', serif" font-size="15" fill="#F8F0F3" font-weight="700">Curriculum vitae</text>
<text x="18" y="43" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="10" fill="#C77B9B" letter-spacing="0.6">PDF</text>
<circle cx="175" cy="29" r="13" fill="#451126" stroke="#701A3D"/>
<path d="M170 29h10m-4 -4l4 4l-4 4" fill="none" stroke="#E5B5C7" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><animateTransform attributeName="transform" type="translate" values="0 0;2 0;0 0" dur="1.8s" repeatCount="indefinite"/></path>
