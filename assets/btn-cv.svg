<svg xmlns="http://www.w3.org/2000/svg" width="201" height="58" viewBox="0 0 201 58" role="img" aria-labelledby="btncv-t">
  <title id="btncv-t">Curriculum vitae (PDF)</title>
  <defs>
    <linearGradient id="btncv-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#190B12"/><stop offset="1" stop-color="#23091A"/>
    </linearGradient>
    <linearGradient id="btncv-rule" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#C77B9B"/><stop offset="1" stop-color="#C77B9B" stop-opacity="0"/>
    </linearGradient>
    <pattern id="btncv-dots" width="8" height="8" patternUnits="userSpaceOnUse">
      <circle cx="4" cy="4" r="0.6" fill="#C77B9B" fill-opacity="0.12"/>
    </pattern>
    <clipPath id="btncv-clip"><rect width="201" height="58" rx="18"/></clipPath>
    
  </defs>
  <g clip-path="url(#btncv-clip)">
