<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="118" viewBox="0 0 1000 118" role="img" aria-labelledby="pportfolio-t">
  <title id="pportfolio-t">Hand-drawn 3D portfolio: A portfolio you walk through: paper-tear loader, a sketched building, a corridor with doors to four rooms. Every drawing is procedural canvas, no image files. Built with three.js · GSAP · Canvas 2D.</title>
  <defs>
    <linearGradient id="pportfolio-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#190B12"/><stop offset="1" stop-color="#23091A"/>
    </linearGradient>
    <linearGradient id="pportfolio-rule" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#C77B9B"/><stop offset="1" stop-color="#C77B9B" stop-opacity="0"/>
    </linearGradient>
    <pattern id="pportfolio-dots" width="8" height="8" patternUnits="userSpaceOnUse">
      <circle cx="4" cy="4" r="0.6" fill="#C77B9B" fill-opacity="0.12"/>
    </pattern>
    <clipPath id="pportfolio-clip"><rect width="1000" height="118" rx="18"/></clipPath>
    
  </defs>
  <g clip-path="url(#pportfolio-clip)">
