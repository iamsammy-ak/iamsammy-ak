<rect x="0" y="0" width="5" height="118" fill="#C77B9B"/>
<text x="976" y="32" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="13" fill="#C77B9B" text-anchor="end" letter-spacing="2">01</text>
<text x="36" y="40" font-family="Georgia, 'Iowan Old Style', 'Palatino Linotype', 'Times New Roman', serif" font-size="22" fill="#F8F0F3" font-weight="700">Hand-drawn 3D portfolio</text>
<rect x="383.96000000000004" y="20" width="57" height="22" rx="11.0" fill="#701A3D" stroke="#E5B5C7" stroke-width="1"/><text x="412.46000000000004" y="34.6" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="10" fill="#F8F0F3" text-anchor="middle">LIVE ↗</text>
<text x="452.96000000000004" y="40" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="12" fill="#C77B9B" fill-opacity="0.9">portfolio</text>
<text x="36" y="66" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#F8F0F3" fill-opacity="0.82">A portfolio you walk through: paper-tear loader, a sketched building, a corridor with doors to</text>
<text x="36" y="85" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#F8F0F3" fill-opacity="0.82">four rooms. Every drawing is procedural canvas, no image files.</text>
<text x="976" y="100" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="10.5" fill="#E5B5C7" text-anchor="end" letter-spacing="1.5" fill-opacity="0.85">THREE.JS · GSAP · CANVAS 2D</text>
