<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="72" viewBox="0 0 1000 72" role="img" aria-labelledby="hcontact-t">
  <title id="hcontact-t">07 Contact</title>
  <defs>
    <linearGradient id="hcontact-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#190B12"/><stop offset="1" stop-color="#23091A"/>
    </linearGradient>
    <linearGradient id="hcontact-rule" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#C77B9B"/><stop offset="1" stop-color="#C77B9B" stop-opacity="0"/>
    </linearGradient>
    <pattern id="hcontact-dots" width="8" height="8" patternUnits="userSpaceOnUse">
      <circle cx="4" cy="4" r="0.6" fill="#C77B9B" fill-opacity="0.12"/>
    </pattern>
    <clipPath id="hcontact-clip"><rect width="1000" height="72" rx="0"/></clipPath>
    
  </defs>
  <g clip-path="url(#hcontact-clip)">

    <text x="0" y="44" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="15" fill="#C77B9B" letter-spacing="3">07</text>
    <text x="50" y="44" font-family="Georgia, 'Iowan Old Style', 'Palatino Linotype', 'Times New Roman', serif" font-size="30" fill="#F8F0F3" font-weight="700">Contact</text>
    <rect x="212" y="38" width="528" height="1" fill="url(#hcontact-rule)">
      <animate attributeName="width" values="0;528" dur="1.6s" fill="freeze"/>
    </rect>
    <circle cx="212" cy="38.5" r="2.5" fill="#E5B5C7"/>
    <text x="1000" y="44" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="11" fill="#C77B9B" text-anchor="end" letter-spacing="2.5">SAY HELLO</text>
    <rect x="0" y="62" width="1000" height="1" fill="#701A3D" fill-opacity="0.5"/>
  </g>
</svg>
